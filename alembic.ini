# Alembic configuration.
#
# The database URL is intentionally NOT set here. env.py binds Alembic to the
# application's own engine (app.database.engine), so both the CLI
# (`alembic upgrade head`) and the programmatic startup path use the exact same
# connection — driven by the DATABASE_URL environment variable (see app/config
# and app/database.py). This keeps SQLite (dev) and a future Postgres/MySQL
# (prod) working with zero edits here.

[alembic]
script_location = alembic
prepend_sys_path = .

# Use a stable, sortable revision-id scheme (NNNN_slug) instead of random hashes.
# The baseline is 0001_baseline; append 0002_, 0003_, … as the schema evolves.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
