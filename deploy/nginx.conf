# =============================================================================
# Nginx site configuration for Fakturace  —  faktury.tmcm.cz
#
# Deploy:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/faktury
#   sudo ln -s /etc/nginx/sites-available/faktury /etc/nginx/sites-enabled/faktury
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then obtain the Let's Encrypt certificate (HTTP-01 via the webroot below):
#   sudo certbot --nginx -d faktury.tmcm.cz
#
# Certbot rewrites the ssl_certificate paths below to the real ones for
# faktury.tmcm.cz and wires up auto-renewal. The HTTP server block already
# serves /.well-known/acme-challenge/ so renewals never get redirected.
# =============================================================================

# ── Rate limiting zone ────────────────────────────────────────────────────────
# Throttle the login/token endpoints to 10 req/min per IP to slow brute-force.
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name faktury.tmcm.cz;

    # ACME challenge for Certbot issuance/renewal (must NOT be redirected).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        allow all;
    }

    # Redirect everything else to HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS (main) ──────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name faktury.tmcm.cz;

    # ── SSL – managed by Certbot (paths are rewritten on first issuance) ──────
    # If using a self-signed certificate instead, replace these two lines:
    #   ssl_certificate     /etc/ssl/certs/faktury-selfsigned.crt;
    #   ssl_certificate_key /etc/ssl/private/faktury-selfsigned.key;
    ssl_certificate     /etc/letsencrypt/live/faktury.tmcm.cz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/faktury.tmcm.cz/privkey.pem;

    # ── SSL settings (modern / intermediate compatibility) ────────────────────
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # OCSP stapling is intentionally OFF. Let's Encrypt has retired OCSP (moved
    # to CRLs) and no longer embeds an OCSP responder URL in its certificates,
    # so `ssl_stapling on;` only produces a startup warning
    # ("ssl_stapling ignored, no OCSP responder URL in the certificate") and
    # staples nothing. The `resolver` was only needed for stapling, so it's gone
    # too. If you ever switch to a CA that still supports OCSP, re-add:
    #   ssl_stapling on; ssl_stapling_verify on;
    #   resolver 1.1.1.1 8.8.8.8 valid=300s; resolver_timeout 5s;
    ssl_stapling         off;

    # ── Body size ─────────────────────────────────────────────────────────────
    # Default nginx limit is 1 MB, which would 413 every logo/stamp (≤5 MB) and
    # expense scan (≤10 MB). 12 MB covers the largest single upload with headroom.
    # The admin backup-import route gets a larger cap in its own location below.
    client_max_body_size 12m;

    # ── Hide version banner ───────────────────────────────────────────────────
    server_tokens off;

    # ── Compression ───────────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   256;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/xml font/woff2;

    # ── Logging ───────────────────────────────────────────────────────────────
    access_log /weby/faktury.tmcm.cz/logs/nginx-access.log;
    error_log  /weby/faktury.tmcm.cz/logs/nginx-error.log warn;

    # ── Security headers ──────────────────────────────────────────────────────
    # NOTE: an `add_header` inside a `location` block REPLACES (does not merge
    # with) the server-level ones. Any location that sets its own add_header
    # therefore re-declares the security set below — see `location /` and
    # `location /static/`. Keep the two lists in sync.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options           "DENY"          always;
    add_header X-Content-Type-Options    "nosniff"       always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    # Tailwind is self-hosted (/static/css/tailwind.css), so no third-party
    # script/style origins are needed. 'unsafe-inline' remains for the inline
    # <script> blocks and inline style attributes still used in the templates;
    # remove it once those are externalised. (X-XSS-Protection is deliberately
    # omitted — it is deprecated and superseded by this CSP.)
    # NOTE: this value MUST stay on ONE physical line. nginx's HTTP/2 module
    # chokes on multi-line (backslash-continued) response headers and returns
    # ERR_HTTP2_PROTOCOL_ERROR with nothing logged. See nginx issue #540.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;

    # ── Static files served directly by Nginx (bypass Gunicorn entirely) ──────
    location /static/ {
        alias /weby/faktury.tmcm.cz/app/app/static/;
        expires     30d;
        add_header  Cache-Control "public, immutable";
        # add_header here overrides the server block, so re-assert the headers
        # that matter for static assets.
        add_header  X-Content-Type-Options "nosniff" always;
        access_log  off;
        try_files   $uri =404;
        # Harden: only allow static file methods.
        limit_except GET HEAD { deny all; }
    }

    # ── Rate-limited login endpoints ──────────────────────────────────────────
    # No add_header here, so it inherits the server-level security headers.
    location ~ ^/(login|token)$ {
        limit_req zone=login_limit burst=5 nodelay;
        proxy_pass http://unix:/run/faktury/gunicorn.sock;
        include    /etc/nginx/proxy_params;
    }

    # ── Admin backup import (large .zip upload) ───────────────────────────────
    # A full per-user backup archive can be well over the default cap; allow up
    # to 200 MB here. The app itself enforces the real zip-bomb / per-entry caps.
    location = /ui/admin/zaloha/import {
        client_max_body_size 200m;
        proxy_pass         http://unix:/run/faktury/gunicorn.sock;
        include            /etc/nginx/proxy_params;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # ── Application proxy (everything else → Gunicorn) ────────────────────────
    location / {
        proxy_pass http://unix:/run/faktury/gunicorn.sock;

        # Standard proxy headers – Gunicorn/FastAPI need these to build
        # correct absolute URLs (e.g. for redirects).
        include    /etc/nginx/proxy_params;

        # WeasyPrint PDF generation can be slow on small VMs.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Do not allow public caching of authenticated pages. add_header here
        # overrides the server block, so the full security set is re-declared.
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options           "DENY"          always;
        add_header X-Content-Type-Options    "nosniff"       always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        # MUST stay on one line — see the note on the server-level CSP above.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;
    }

    # ── Block access to sensitive files that should never be public ───────────
    location ~ /\.(env|db|git|venv) {
        deny all;
        return 404;
    }
}
